<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="600" height="600">
  <defs>
    <style>
      .ink { fill: none; stroke: #1e1e1e; stroke-linecap: round; stroke-linejoin: round; }
      .wht { fill: none; stroke: #fffefa; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- backpack behind the body -->
  <path d="M84 150 C 78 132, 96 124, 116 128 L 122 200 C 104 206, 86 204, 80 192 C 74 176, 78 162, 84 150 Z" fill="#8fb87c" stroke="#1e1e1e" stroke-width="6.5" stroke-linejoin="round"/>
  <path d="M86 168 C 92 160, 104 158, 114 162" fill="none" stroke="#1e1e1e" stroke-width="4" stroke-linecap="round" opacity=".55"/>
  <!-- limbs + torso: outline pass -->
  <g class="ink">
    <path d="M150 214 C 120 222, 90 232, 64 246" stroke-width="34"/>
    <path d="M150 214 C 180 222, 210 232, 236 246" stroke-width="34"/>
    <path d="M120 168 C 104 184, 100 200, 104 216" stroke-width="30"/>
    <path d="M118 150 C 102 176, 104 204, 122 216 C 140 222, 160 222, 178 216 C 196 204, 198 176, 182 150 Z" stroke-width="14" fill="#1e1e1e"/>
  </g>
  <!-- limbs + torso: fill pass -->
  <g class="wht">
    <path d="M150 214 C 120 222, 90 232, 64 246" stroke-width="20"/>
    <path d="M150 214 C 180 222, 210 232, 236 246" stroke-width="20"/>
    <path d="M120 168 C 104 184, 100 200, 104 216" stroke-width="16"/>
    <path d="M118 150 C 102 176, 104 204, 122 216 C 140 222, 160 222, 178 216 C 196 204, 198 176, 182 150 Z" stroke-width="0" fill="#fffefa"/>
  </g>
  <!-- head -->
  <circle cx="150" cy="92" r="62" fill="#fffefa" stroke="#1e1e1e" stroke-width="7"/>
  <!-- face -->
  <ellipse cx="118" cy="112" rx="10" ry="6.5" fill="#f4b6a6" opacity=".85"/>
  <ellipse cx="182" cy="112" rx="10" ry="6.5" fill="#f4b6a6" opacity=".85"/>
  <circle cx="130" cy="97" r="5.8" fill="#1e1e1e"/>
  <circle cx="168" cy="97" r="5.8" fill="#1e1e1e"/>
  <path d="M138 114 Q 149 124 160 114" fill="none" stroke="#1e1e1e" stroke-width="4.8" stroke-linecap="round"/>
  <!-- raised arm scratching head (drawn over the head) -->
  <path class="ink" d="M182 166 C 214 160, 228 128, 210 98" stroke-width="30"/>
  <path class="wht" d="M182 166 C 214 160, 228 128, 210 98" stroke-width="16"/>
  <path d="M120 150 C 140 158, 162 158, 180 150" fill="none" stroke="#1e1e1e" stroke-width="0"/>
  <!-- scratch marks -->
  <path d="M232 92 l 10 -6 M234 104 l 12 -2" fill="none" stroke="#1e1e1e" stroke-width="3.5" stroke-linecap="round"/>
  <!-- sweat drop -->
  <path d="M86 40 C 79 54, 77 62, 86 67 C 95 62, 93 54, 86 40 Z" fill="#a8d1ea" stroke="#1e1e1e" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- question mark -->
  <path d="M236 30 C 236 12, 270 10, 270 30 C 270 44, 252 46, 252 60" fill="none" stroke="#d27245" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="252" cy="78" r="6.5" fill="#d27245"/>
</svg>
